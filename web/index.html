<!DOCTYPE html>
<html>
  <script>
  // Dev-phase kill switch: unregister Flutter's caching service worker.
  // Keep firebase-messaging-sw.js: it delivers hourly reminders.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) {
        var w = r.active || r.waiting || r.installing;
        if (w && w.scriptURL.indexOf('firebase-messaging-sw.js') !== -1) return;
        r.unregister();
      });
    });
  }
</script>

  <script>
    function efocFixWebm(blobUrl, durationMs, onDone) {
      fetch(blobUrl)
        .then(function(res) { return res.blob(); })
        .then(function(blob) {
          ysFixWebmDuration(blob, durationMs, function(fixedBlob) {
            var url = URL.createObjectURL(fixedBlob);
            onDone(url);
          }, { logger: false });
        })
        .catch(function(err) {
          onDone(null);
        });
    }
  </script>
