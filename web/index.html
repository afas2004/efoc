<!DOCTYPE html>
<html>
  <script>
  // Dev-phase kill switch: unregister Flutter's caching service worker.
  // Keep firebase-messaging-sw.js: it delivers hourly reminders.
  // Keep share-target-sw.js: it receives files shared into efoc.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) {
        var w = r.active || r.waiting || r.installing;
        if (!w) { r.unregister(); return; }
        if (w.scriptURL.indexOf('firebase-messaging-sw.js') !== -1) return;
        if (w.scriptURL.indexOf('share-target-sw.js') !== -1) return;
        r.unregister();
      });
    });
    // Register the push worker up front (same path and scope Firebase
    // uses) so it's already active when someone turns reminders on.
    // Registering it at that moment made the first token request fail
    // with "no active Service Worker".
    navigator.serviceWorker
      .register('/firebase-messaging-sw.js', {
        scope: '/firebase-cloud-messaging-push-scope'
      })
      .catch(function() {});

    // Share target: Android sends POST /share here when someone shares an
    // image (or a .wastickers file) into efoc. Narrow scope on purpose —
    // this worker must never sit in front of the app itself.
    navigator.serviceWorker
      .register('/share-target-sw.js', { scope: '/share' })
      .catch(function() {});
  }
</script>

  <script>
    function efocFixWebm(blobUrl, durationMs, onDone) {
      fetch(blobUrl)
        .then(function(res) { return res.blob(); })
        .then(function(blob) {
          ysFixWebmDuration(blob, durationMs, function(fixedBlob) {
            var url = URL.createObjectURL(fixedBlob);
            onDone(url);
          }, { logger: false });
        })
        .catch(function(err) {
          onDone(null);
        });
    }
  </script>
