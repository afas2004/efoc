  <script src="fix-webm-duration.js"></script>
  <script>
    function efocFixWebm(blobUrl, onDone) {
      fetch(blobUrl)
        .then(function(res) { return res.blob(); })
        .then(function(blob) {
          ysFixWebmDuration(blob, 2000, function(fixedBlob) {
            var url = URL.createObjectURL(fixedBlob);
            onDone(url);
          }, { logger: false });
        })
        .catch(function(err) {
          onDone(null);
        });
    }
  </script>
