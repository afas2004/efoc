name: Stitch daily vlogs

on:
  schedule:
    # 16:10 UTC = 00:10 in Asia/Kuala_Lumpur (UTC+8). If you change APP_TZ,
    # move this so it fires just after that zone's midnight.
    - cron: "10 16 * * *"
    # 06:10 local: retry. Already-stitched groups are skipped, so this only
    # does work if the midnight run failed (raw clips are deleted once
    # their day is stitched, so a missed stitch would lose the day).
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to stitch (YYYY-MM-DD). Blank = yesterday."
        required: false
      group_id:
        description: "Only this group id. Blank = all groups."
        required: false
      force:
        description: "Re-stitch even if a vlog already exists"
        type: boolean
        default: false

concurrency:
  group: stitch
  cancel-in-progress: false

jobs:
  stitch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-dejavu-extra

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r worker/requirements.txt

      - name: Stitch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_TZ: ${{ vars.APP_TZ || 'Asia/Kuala_Lumpur' }}
        run: |
          args=()
          [ -n "${{ inputs.date }}" ] && args+=(--date "${{ inputs.date }}")
          [ -n "${{ inputs.group_id }}" ] && args+=(--group "${{ inputs.group_id }}")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          python worker/stitch.py --no-cleanup "${args[@]}"

      # Copies every stitched vlog that isn't backed up yet to Google Drive
      # (My Drive/efoc/<Log name>/<date>.mp4), then marks it backed up.
      # Only marked vlogs may be deleted by the cleanup below.
      - name: Back up to Google Drive
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          if [ -z "$GDRIVE_TOKEN" ]; then
            echo "::warning::GDRIVE_TOKEN secret not set, skipping the Drive backup"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          {
            echo "[gdrive]"
            echo "type = drive"
            echo "scope = drive"
            echo "token = $GDRIVE_TOKEN"
          } > ~/.config/rclone/rclone.conf

          python worker/backup.py --dest out --no-mark --manifest manifest.json
          if [ -n "$(ls -A out 2>/dev/null)" ]; then
            rclone copy out gdrive:efoc --transfers 4
            python worker/backup.py --mark-from manifest.json
          fi

      # Free-tier retention (see cleanup() in stitch.py). Skipped for a
      # manual re-stitch of a specific date.
      - name: Clean up old clips and vlogs
        if: ${{ !cancelled() && inputs.date == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_TZ: ${{ vars.APP_TZ || 'Asia/Kuala_Lumpur' }}
          # Data from before this date is never deleted. To apply the
          # policy to everything, add a repo variable RETENTION_START with
          # an early date (e.g. 2000-01-01).
          RETENTION_START: ${{ vars.RETENTION_START || '2026-10-16' }}
        run: python worker/stitch.py --cleanup-only
