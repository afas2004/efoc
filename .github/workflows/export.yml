name: Make a vlog (on demand)

# Started by the start-export Supabase Edge Function when someone taps
# "Make a vlog" in the app. Stitches one exports row (worker/export.py).
on:
  workflow_dispatch:
    inputs:
      export_id:
        description: "exports row id"
        required: true

concurrency:
  group: export-${{ inputs.export_id }}
  cancel-in-progress: false

jobs:
  export:
    # Pinned: ubuntu-latest moves between releases and its apt can stall.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Static ffmpeg from GitHub instead of apt: apt kept stalling for 15+
      # minutes on the Ubuntu mirrors. Cached between runs.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1-linux64-gpl

      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/ffmpeg
            url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
            curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz "$url"
            tar -xJf /tmp/ffmpeg.tar.xz -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          ~/ffmpeg/ffmpeg -hide_banner -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests google-auth

      - name: Fetch caption fonts
        run: |
          mkdir -p /tmp/efoc-fonts && cd /tmp/efoc-fonts
          base=https://github.com/google/fonts/raw/main/ofl
          get() { curl -fsSL -o "$1" "$base/$2" || echo "::warning::font $1 missing, using fallback"; }
          get Poppins-Bold.ttf poppins/Poppins-Bold.ttf
          get Anton-Regular.ttf anton/Anton-Regular.ttf
          get PlayfairDisplay-Italic.ttf "playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf"
          get JetBrainsMono.ttf "jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"
          get Caveat.ttf "caveat/Caveat%5Bwght%5D.ttf"
          get Pacifico-Regular.ttf pacifico/Pacifico-Regular.ttf
          # Labels use DejaVu (preinstalled on the runner); if it's ever
          # missing, use Poppins so drawtext still has a font.
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || echo "FONT_FILE=/tmp/efoc-fonts/Poppins-Bold.ttf" >> "$GITHUB_ENV"

      - name: Stitch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_TZ: ${{ vars.APP_TZ || 'Asia/Kuala_Lumpur' }}
        run: python worker/export.py --id "${{ inputs.export_id }}"
